name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            pkg-config

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: linux-cabal-${{ hashFiles('Sims4-mod-manager.cabal') }}
          restore-keys: linux-cabal-

      - name: Build
        run: |
          cabal update
          cabal build exe:Sims4-mod-manager
          cp "$(cabal list-bin Sims4-mod-manager)" Sims4-mod-manager-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Sims4-mod-manager-linux

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sims4-mod-manager-linux
          generate_release_notes: true
